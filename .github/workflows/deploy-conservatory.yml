name: Conservatory — Safe Preview / Manual Production Deploy

# SAFETY HOLD: Private branding must be recovered and verified before enabling auto-deploy.
# Code changes do not silently overwrite either live site.
on:
  push:
    branches: [main]
    paths:
      - "private/**"
      - "public/**"
      - ".github/workflows/deploy-conservatory.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Choose EXACTLY one website to deploy"
        type: choice
        required: true
        options:
          - public
          - private
      confirmation:
        description: "Type DEPLOY PUBLIC or DEPLOY PRIVATE to confirm"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: conservatory-manual-production
  cancel-in-progress: false

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify separate site roots (if uploaded)
        run: |
          for site in private public; do
            if [ -f "$site/index.html" ] && [ -f "$site/_worker.js" ]; then
              echo "Checking $site"
              node --check "$site/_worker.js"
            else
              echo "No deployable $site folder committed yet. This is not an error."
            fi
          done

  deploy-one-site:
    if: github.event_name == 'workflow_dispatch'
    needs: check-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explicit target confirmation
        id: gate
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirmation }}
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$TARGET:$CONFIRM" in
            private:'DEPLOY PRIVATE') PROJECT="novel-conservatory" ;;
            public:'DEPLOY PUBLIC')
              PROJECT="novel-conservatory-public" ;;
            *) echo "::error::Confirmation doesn't match target"; exit 1 ;;
          esac
          if [ -z "$CF_API" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Cloudflare deployment secrets not configured"; exit 1
          fi
          if [ ! -f "$TARGET/_worker.js" ] || [ ! -f "$TARGET/index.html" ]; then
            echo "::error::$TARGET site source not uploaded"; exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
      - name: Deploy selected site only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ inputs.target }} --project-name=${{ steps.gate.outputs.project }} --branch=main
