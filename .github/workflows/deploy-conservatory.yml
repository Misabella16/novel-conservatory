name: Deploy Novel Conservatory
on:
  push:
    branches: [main]
    paths:
      - 'private/**'
      - 'public/**'
      - '.github/workflows/deploy-conservatory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conservatory-production
  cancel-in-progress: false

jobs:
  deploy-private:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check uploaded private source files
        id: source
        run: |
          if [ -f private/_worker.js ] && [ -f private/index.html ] && [ -f private/admin/add-novels.js ]; then
            node --check private/_worker.js
            node --check private/admin/add-novels.js
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Source folders not uploaded yet; skipping private deployment."
          fi
      - name: Check Cloudflare deployment credentials
        id: creds
        env:
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping deployment."
          fi
      - name: Deploy existing private Pages project
        if: steps.creds.outputs.enabled == 'true' && steps.source.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy private --project-name=novel-conservatory --branch=main

  deploy-public:
    if: ${{ vars.PUBLIC_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check uploaded public source files
        id: source
        run: |
          if [ -f public/_worker.js ] && [ -f public/index.html ] && [ -f public/submit-novel/form.js ]; then
            node --check public/_worker.js
            node --check public/submit-novel/form.js
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Source folders not uploaded yet; skipping public deployment."
          fi
      - name: Check Cloudflare deployment credentials
        id: creds
        env:
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping deployment."
          fi
      - name: Deploy public backend-enabled Pages project
        if: steps.creds.outputs.enabled == 'true' && steps.source.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.PUBLIC_PAGES_PROJECT }} --branch=main
