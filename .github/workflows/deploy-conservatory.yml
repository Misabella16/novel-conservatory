name: Deploy Novel Conservatory
on:
  push:
    branches: [main]
    paths:
      - 'private/**'
      - 'public/**'
      - '.github/workflows/deploy-conservatory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conservatory-production
  cancel-in-progress: false

jobs:
  deploy-private:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check private Pages files
        run: |
          test -f private/_worker.js
          test -f private/index.html
          node --check private/_worker.js
          node --check private/admin/add-novels.js
      - name: Deploy existing private Pages project
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy private --project-name=novel-conservatory --branch=main

  deploy-public:
    if: ${{ vars.PUBLIC_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public Pages files
        run: |
          test -f public/_worker.js
          test -f public/index.html
          node --check public/_worker.js
          node --check public/submit-novel/form.js
      - name: Deploy public backend-enabled Pages project
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.PUBLIC_PAGES_PROJECT }} --branch=main
