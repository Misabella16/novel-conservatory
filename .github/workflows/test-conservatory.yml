name: Validate Conservatory source and metadata imports
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check private/_worker.js
          node --check public/_worker.js
          node --check private/admin/epub-insights.js
          node --check private/admin/epub-metadata.js
          node --check private/admin/nu-browser-capture.js
          node --check private/admin/add-novels.js
      - name: Verify private EPUB indicators and homepage scripts
        run: python tests/check_private_epub_indicators.py
      - name: Check Python syntax and parse source-only retrieval
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5'
          python -m py_compile scripts/import_novelupdates.py scripts/crawl_novelupdates.py
          python -m unittest discover -s tests -p 'test_nu_importer.py' -v
      - name: Validate public About guide
        run: python tests/check_public_about_guide.py
      - name: Verify first-visit tours and exclude-tag filters
        run: python tests/check_onboarding_tours.py
      - name: Verify private sign-out and public saved-data controls
        run: python tests/check_signout_controls.py
      - name: Verify Discover collections, mobile layout and private EPUB intake
        run: python tests/check_discover_and_epub_submissions.py
      - name: Verify public Novel Updates links and private staging review
        run: python tests/check_public_novel_updates_links.py
      - name: Verify expanded tours and EPUB verified-state controls
        run: python tests/check_expanded_tours_and_epub_verification.py
      - name: Verify member EPUB reviews and compact private Discover
        run: python tests/check_member_verification_and_compact_discover.py
      - name: Verify Add Novels editor and owner permission tabs
        run: node tests/check_add_novels_editor_roles.js
      - name: Verify unified Submit EPUB and Add Novel Entry tabs
        run: node tests/check_unified_submit_epub.js
      - name: Verify per-book Novel Updates corrections
        run: python tests/check_per_novel_nu_corrections.py
      - name: Verify Novel Updates staged metadata imports into submitted books
        run: python tests/check_submitted_nu_metadata_import.py
      - name: Verify existing Novel Updates link refresh guidance and cover safety
        run: python tests/check_nu_refresh_guidance.py
      - name: Verify stored EPUB metadata recovery and private cover permissions
        run: python tests/check_stored_epub_recovery.py
      - name: Verify one-click batch duplicate merges with independent Undo
        run: python tests/check_one_click_multi_batch_undo.py
      - name: Verify direct NU sync, duplicate merging, literal search and Undo
        run: python tests/check_nu_direct_merge_undo.py
      - name: Verify duplicate-safe direct novel creation
        run: python tests/check_direct_novel_reuse.py
      - name: Prevent duplicate Add Novel records and preserve Undo
        run: python tests/check_duplicate_safe_create.py
      - name: Verify safe one-click duplicate batch merge and Undo
        run: python tests/check_safe_duplicate_batch.py
      - name: Prevent private-to-public metadata leaks during duplicate merging
        run: node tests/check_private_visibility_merge.js
      - name: Verify instant editor save and Undo for added novels
        run: python tests/check_editor_direct_undo.py
      - name: Verify Undo for newly created catalogue entries
        run: python tests/check_creation_undo_history.py
      - name: Check migration SQL offline
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(":memory:")
          source=Path("database/NU_STAGING_MIGRATION.sql").read_text()
          db.executescript(source)
          db.execute("INSERT INTO nu_staged_series(slug,nu_url,title,payload_json) VALUES (?,?,?,?)",
              ("book","https://www.novelupdates.com/series/book/","Book","{}"))
          assert db.execute("SELECT state FROM nu_staged_series WHERE slug='book'").fetchone()[0]=="draft"
          assert db.execute("SELECT next_page FROM nu_import_progress").fetchone()[0]==1
          print("Migration, defaults and staging schema: OK")
          PY
