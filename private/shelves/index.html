<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reading Shelves · The Novel Conservatory</title><style>
:root{--olive:#365346;--sand:#f6f1e8;--ink:#2a3e35;--border:#dadbcf;--mute:#69766d}*{box-sizing:border-box}body{margin:0;background:var(--sand);font:14px/1.55 system-ui,-apple-system,sans-serif;color:var(--ink)}main{max-width:1160px;margin:auto;padding:24px 20px 80px}a{color:var(--olive)}header{background:#234b3e;color:#fdf6e7;padding:28px max(22px,calc((100vw - 1160px)/2));}header a{color:#f3d6b1}header h1{font:normal 38px/1.15 Georgia,serif;margin:7px 0}h2{font:normal 25px Georgia,serif;margin:4px 0 10px}h3{margin:6px 0}p{color:var(--mute)}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;margin-top:22px}.box{padding:19px 22px;border:1px solid var(--border);border-radius:12px;background:#fffdfa;box-shadow:0 7px 24px #1f382a0b}.stack{display:grid;gap:11px}button,input,select,textarea{font:inherit}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #bfcabd;border-radius:7px;background:white;color:#24392e}textarea{min-height:70px}button{border:1px solid var(--olive);background:var(--olive);color:white;padding:10px 14px;border-radius:8px;cursor:pointer}button.soft{color:var(--olive);background:#edf3ed;border-color:#c5d3c4}button.danger{color:#943d3d;border-color:#e7c4be;background:#fff3ef}button:disabled{opacity:.5;cursor:default}.shelf{display:block;width:100%;background:#f6f7f3;border:1px solid #d9e0d4;color:var(--ink);text-align:left;margin-bottom:8px}.shelf.active{background:#e3eee3;border-color:#698b6f}.shelf small{display:block;color:#68816c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:var(--mute);font-size:12px}.chip{display:inline-block;background:#edf2eb;color:#4c704f;font-size:11px;border-radius:20px;padding:4px 8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #edf0e9;padding:11px 0}.item strong{display:block}.item small{color:var(--mute)}.item button{font-size:11px;padding:7px 10px}.hidden{display:none!important}.divider{border:0;border-top:1px solid #e2e6dc;margin:20px 0}label{display:block;font-size:12px;color:#4f6658;margin:9px 0}label input,label select{margin-top:4px}.notice{margin-top:14px;padding:10px;border-radius:8px;background:#eff5ed;color:#416e4d;min-height:25px}.notice.error{background:#fae8e4;color:#a33b35}.community-row{padding:10px 0;border-bottom:1px solid #e2e7dc}.community-row button{margin-left:8px} @media(max-width:740px){.layout{grid-template-columns:1fr}.box{padding:16px}.two{grid-template-columns:1fr}header h1{font-size:30px}}
</style></head><body><header><a href="/">← Back to the Conservatory</a><h1>My reading shelves</h1><div>Private by default. Share with invited friends when you choose.</div></header><main><div id="identity" class="muted">Loading your library identity…</div><div class="layout"><section class="box"><h2>My shelves</h2><div id="my-shelves"></div><button type="button" class="soft" id="create">+ New shelf</button><p><a href="/api/shelves/export">↓ Download my private shelf backup</a></p><hr class="divider"><h2>Friends' shelves</h2><p class="muted">Only shelves their owners chose to share appear here.</p><div id="community"></div></section><section class="box"><div id="shelf-detail"><h2>Select a shelf</h2></div><div id="notice" class="notice hidden" role="status"></div></section></div></main><script>
'use strict';const $=s=>document.getElementById(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,method='GET',data)=>{const r=await fetch(path,{method,credentials:'same-origin',cache:'no-store',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};
let email='',mine=[],community=[],books=[],selection=null,edits={};const book=x=>{const b=books.find(b=>b.id===Number(x));return b?{...b,...(edits[b.id]||{})}:{id:x,title:'Novel #'+x}};
function say(msg,err=false){$('notice').textContent=msg;$('notice').classList.remove('hidden');$('notice').classList.toggle('error',err)}
async function refresh(){const [my,group]=await Promise.all([api('/api/shelves/mine'),api('/api/shelves/community')]);email=my.owner;mine=my.shelves;community=group.shelves;drawList();if(selection)select(selection.owner,selection.id);}
function drawList(){ $('my-shelves').innerHTML=mine.map(s=>`<button class="shelf ${selection?.owner===email&&selection.id===s.id?'active':''}" data-me="${esc(s.id)}">${esc(s.name)} <small>${s.items.length} novels · ${esc(s.visibility)}</small></button>`).join('');$('community').innerHTML=community.length?community.map(s=>`<div class="community-row"><strong>${esc(s.name)}</strong><small>By ${esc(s.owner)} · ${s.items.length} novels</small><button class="soft" data-foreign="${esc(s.owner)}" data-id="${esc(s.id)}">View</button></div>`).join(''):'<p class="muted">No shared shelves yet.</p>';
  document.querySelectorAll('[data-me]').forEach(btn=>btn.onclick=()=>select(email,btn.dataset.me));document.querySelectorAll('[data-foreign]').forEach(btn=>btn.onclick=()=>select(btn.dataset.foreign,btn.dataset.id)); }
async function save(body){try{const a=await api('/api/shelves','POST',body);say('Saved!');await refresh();return a}catch(e){say(e.message,true);return null}}
async function select(owner,id){selection={owner,id};drawList();try{
 const {shelf:s,canEdit}=await api('/api/shelves/view?owner='+encodeURIComponent(owner)+'&id='+encodeURIComponent(id));const isOwn=owner===email;
 $('shelf-detail').innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">${esc(s.name)}</h2><span class="chip">${esc(s.visibility)}</span></div><p>${isOwn?'Your shelf':`Shared by ${esc(owner)}`} · ${s.items.length} novels</p>
 ${isOwn?`<section class="stack" style="background:#f4f7f2;padding:13px;border-radius:9px"><div class="two"><label>Shelf name<input id="edit-name" maxlength="80" value="${esc(s.name)}"></label><label>Visibility<select id="edit-visibility"><option value="private">Private, only me</option><option value="friends">Shared with all invited friends</option><option value="collaborative">Collaborative, selected friends</option></select></label></div><label id="collab-wrap">Collaborators' email addresses, separated by commas<input id="edit-collabs" value="${esc(s.collaborators.join(', '))}" placeholder="friend@example.com"></label><div class="toolbar"><button id="save-settings">Save shelf settings</button><button id="delete-shelf" class="danger">Delete shelf</button></div></section>`:''}
 ${canEdit?`<section class="stack" style="margin-top:18px"><h3>Add a novel</h3><input id="search-book" placeholder="Search all 962 novels by title"><select id="book-pick"><option value="">Choose a novel</option></select><label>Reading notes (optional)<textarea id="note" maxlength="300" placeholder="My thoughts, chapter progress, or a note for friends"></textarea></label><button id="add-book">Add to this shelf</button></section>`:''}
 ${isOwn&&s.id==='favorites'?'<div class="toolbar"><button id="import-favs" class="soft">Import my old browser favorites</button></div>':''}
 <hr class="divider"><h3>Books on this shelf</h3><div id="items">${s.items.length?s.items.map(i=>`<div class="item"><div><strong>${esc(book(i.id).title)}</strong>${i.notes?`<small>${esc(i.notes)}</small>`:''}<small>#${i.id}</small></div>${canEdit?`<button class="danger" data-remove="${i.id}">Remove</button>`:''}</div>`).join(''):'<p class="muted">This shelf is empty. Add the first book above.</p>'}</div>`;
 if(isOwn){$('edit-visibility').value=s.visibility;$('collab-wrap').classList.toggle('hidden',s.visibility!=='collaborative');$('edit-visibility').onchange=()=>$('collab-wrap').classList.toggle('hidden',$('edit-visibility').value!=='collaborative');$('save-settings').onclick=()=>save({action:'update',id,name:$('edit-name').value,visibility:$('edit-visibility').value,collaborators:$('edit-collabs').value.split(',').map(x=>x.trim()).filter(Boolean)});$('delete-shelf').onclick=()=>{if(confirm('Delete this shelf and all its saved notes?'))save({action:'delete',id})};}
 if(canEdit){const populate=()=>{const q=$('search-book').value.toLocaleLowerCase().trim();const matches=books.filter(b=>{const v=book(b.id);return !q||`${v.title} ${v.originalTitle||''}`.toLocaleLowerCase().includes(q)}).slice(0,70);$('book-pick').innerHTML='<option value="">Choose a novel</option>'+matches.map(x=>`<option value="${x.id}">${esc(book(x.id).title)}</option>`).join('')};$('search-book').oninput=populate;populate();$('add-book').onclick=()=>{if(!$('book-pick').value){say('Select a novel first.',true);return;}save({action:'add',owner,id,bookId:Number($('book-pick').value),notes:$('note').value})};document.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>save({action:'remove-book',owner,id,bookId:Number(btn.dataset.remove)}));}
 if(isOwn&&s.id==='favorites')$('import-favs').onclick=async()=>{let old=[];try{old=JSON.parse(localStorage.getItem('novel-conservatory-favorites')||'[]')}catch{}let added=0;for(const item of old.filter(x=>Number.isInteger(x)&&x>0&&x<=962).slice(0,300)){if(s.items.some(x=>x.id===item))continue;const result=await save({action:'add',id,bookId:item,notes:''});if(!result)break;added++;}say(added+' browser favorites imported. Original browser favorites remain unchanged.');};
 }catch(e){say(e.message,true)}}
$('create').onclick=async()=>{const name=prompt('What shall we call your new shelf?');if(!name)return;const result=await save({action:'create',name});if(result){const last=result.shelves[result.shelves.length-1];select(email,last.id)}};
(async()=>{try{const [b,c]=await Promise.all([api('/api/catalogue'),api('/api/content')]);books=b;for(const e of c.edits||[])edits[e.id]=e.patch;await refresh();$('identity').textContent='Signed in as '+email+' · Your private shelves are visible only to you.';if(mine[0])select(email,mine[0].id);}catch(e){say(e.message,true)}})();
</script></body></html>
