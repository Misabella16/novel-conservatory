<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Link Reports · Novel Conservatory</title><style>body{background:#f5f1e9;color:#2e4d3b;font:14px/1.5 system-ui;margin:0}main{max-width:980px;margin:auto;padding:25px}header{background:#285345;color:white;padding:22px 5%}header a{color:#fff5dd}.item{background:#fffefb;padding:18px;margin:13px 0;border-radius:12px;border:1px solid #d6ded1}h1{font:32px Georgia,serif;margin:10px 0}h2{font:23px Georgia,serif}small{color:#718477}p{overflow-wrap:anywhere}button,select{padding:9px;border-radius:7px;border:1px solid #9bad9a;background:white;color:#395b48;cursor:pointer}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar a{color:#2d6250} .badge{background:#e9efe5;padding:4px 8px;border-radius:20px;font-size:12px}.note{color:#8c4d38}#status{margin:10px 0}</style></head><body><header><a href="/admin/">← Admin</a><h1>Reader link reports</h1><div>Review broken or relocated translator links before replacing them.</div></header><main><nav class="bar"><a href="/admin/library-tools.html">Sheet sync & backups</a><a href="/admin/translator-import.html">CG translator importer</a></nav><p id="status">Loading reports…</p><div id="reports"></div></main><script>
const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,method='GET',body)=>{const r=await fetch(path,{cache:'no-store',method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};
async function render(){try{const d=await api('/api/admin/link-reports');const reports=d.reports||[];$('status').textContent=reports.length+' report(s) · unresolved: '+reports.filter(x=>['open','reviewing'].includes(x.status)).length;$('reports').innerHTML=reports.length?reports.map(r=>`<article class="item"><div class="bar"><strong>Novel #${r.bookId}</strong><span class="badge">${esc(r.reason)}</span><small>Reported ${esc(r.createdAt)}</small></div><p>${esc(r.message)||'<em>No details supplied</em>'}</p><p><small>Reporter: ${esc(r.reporter)} · ${r.url?`<a target="_blank" rel="noopener noreferrer" href="${esc(r.url)}">Reported URL</a>`:'No URL supplied'}</small></p><div class="bar"><a href="/admin/?book=${r.bookId}">Edit novel</a><select aria-label="Report status" data-status="${esc(r.id)}"><option value="open">Open</option><option value="reviewing">Reviewing</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select><button data-save="${esc(r.id)}">Update status</button></div></article>`).join(''):'<p>No reports yet.</p>';for(const r of reports){const select=document.querySelector(`[data-status="${r.id}"]`);select.value=r.status;document.querySelector(`[data-save="${r.id}"]`).onclick=async()=>{try{await api('/api/admin/link-reports','POST',{id:r.id,status:select.value});render()}catch(e){$('status').textContent=e.message}}}}catch(e){$('status').textContent=e.message}}
render();
</script></body></html>
